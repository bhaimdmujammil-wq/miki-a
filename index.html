<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miki Live</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090b16;
  color:white;
}
.header{
  padding:20px;
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  border-radius:0 0 25px 25px;
}
.logo{font-size:28px;font-weight:bold}
.balance{
  margin-top:15px;
  background:#ffffff20;
  padding:12px;
  border-radius:15px;
}
.container{padding:18px}
.title{font-size:21px;font-weight:bold;margin:15px 0}
.rooms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.room{
  background:#15182a;
  padding:15px;
  border-radius:18px;
}
.room-img{
  height:100px;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}
.room-name{margin-top:10px;font-weight:bold}
.online{color:#50fa7b;font-size:13px;margin-top:5px}
button{
  border:0;
  padding:12px 18px;
  border-radius:15px;
  font-weight:bold;
  color:white;
  background:#6c5ce7;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111426;
  display:flex;
  justify-content:space-around;
  padding:14px 5px;
}
.bottom div{text-align:center;font-size:13px}
</style>
</head>

<body>

<div class="header">
  <div class="logo">🎙️ MIKI LIVE</div>
  <div>Live Voice Chat</div>

  <div class="balance">
    🪙 Coins: <b>∞</b>
    &nbsp;&nbsp;
    💎 VIP 12
  </div>
</div>

<div class="container">

  <div class="title">🔥 Live Rooms</div>

  <div class="rooms">

    <div class="room">
      <div class="room-img">🎤</div>
      <div class="room-name">Miki Party</div>
      <div class="online">● 128 Online</div>
      <br>
      <button onclick="joinRoom('Miki Party')">Join</button>
    </div>

    <div class="room">
      <div class="room-img">🎧</div>
      <div class="room-name">Music Room</div>
      <div class="online">● 86 Online</div>
      <br>
      <button onclick="joinRoom('Music Room')">Join</button>
    </div>

    <div class="room">
      <div class="room-img">🔥</div>
      <div class="room-name">Friends Room</div>
      <div class="online">● 54 Online</div>
      <br> 
      <button onclick="joinRoom('Friends Room')">Join</button>
    </div>

    <div class="room">
      <div class="room-img">👑</div>
      <div class="room-name">VIP Room</div>
      <div class="online">● 32 Online</div>
      <br>
      <button onclick="joinRoom('VIP Room')">Join</button>
    </div>

  </div>

  <div class="title">👑 Owner</div>

  <div class="room">
    <b>Owner Level: 200</b><br><br>
    💎 VIP 12 &nbsp; 🪙 Unlimited Coins
  </div>

</div>

<div class="bottom">
  <div>🏠<br>Home</div>
  <div>🎙️<br>Live</div>
  <div>🪙<br>Coins</div>
  <div>💎<br>VIP</div>
  <div>👤<br>Profile</div>
</div>
 
<script>
function joinRoom(room){
  alert("Joining " + room + "...");
}
</script>

</body>
</html>
